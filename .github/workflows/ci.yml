name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Check out the post-merge state on PRs so CI validates what will land on main,
# not just the branch tip. Falls back to the commit SHA on push/workflow_dispatch.
env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
  SANDBOX_ROLE: arn:aws:iam::975050268859:role/nakomis-lapcat-github-ci-sandbox
  PROD_ROLE: arn:aws:iam::637423226886:role/nakomis-lapcat-github-ci-prod

jobs:
  # ── Path-change detection ─────────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      apple: ${{ steps.filter.outputs.apple }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'
            apple:
              - 'apple/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  # ── TypeScript / CDK + Lambda ─────────────────────────────────────────────────
  infra:
    name: Infra (CDK / Lambda)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'pnpm'
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm run build
      - name: Test + coverage
        run: pnpm test

  # ── CDK synth (validates template on PRs and pushes) ─────────────────────────
  synth-infra:
    name: CDK synth
    runs-on: ubuntu-latest
    needs: [changes, infra]
    if: |
      (needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.infra.result == 'success'
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'pnpm'
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.SANDBOX_ROLE }}
          aws-region: eu-west-2
      - name: CDK synth (sandbox)
        run: pnpm run ci-synth-sandbox --output cdk-synth.out

  # ── watchOS + iOS apps ───────────────────────────────────────────────────────
  apple:
    name: Apple apps (build + test)
    runs-on: macos-26
    needs: changes
    if: needs.changes.outputs.apple == 'true' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Shared package tests
        working-directory: apple/LapcatShared
        run: swift test
      - name: Build watch app
        run: >-
          xcodebuild -project Lapcat.xcodeproj -scheme LapcatWatch
          -destination 'generic/platform=watchOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build + test iPhone app
        run: |
          SIM=$(xcrun simctl list devices available iPhone -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -project Lapcat.xcodeproj -scheme "Lapcat (Sandbox)" \
            -destination "id=${SIM}" CODE_SIGNING_ALLOWED=NO

  # ── React / web portal ───────────────────────────────────────────────────────
  web:
    name: Web portal (React)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      # pnpm/action-setup must precede setup-node so its cache can key off the pnpm store.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint + format check (Biome)
        run: pnpm lint
      # config.json is gitignored and written from SSM by set-config.sh at deploy
      # time. This job has no AWS access, so seed the committed template purely to
      # satisfy the `import './config.json'` in config.ts.
      - name: Seed placeholder config
        run: cp src/config/config.json.template src/config/config.json
      - name: Type-check
        run: pnpm typecheck
      - name: Test + coverage
        run: pnpm test
      - name: Build
        run: pnpm build

  # ── Version (computed once per merge, from the shared deployment tracker) ────
  version:
    name: Compute version
    runs-on: ubuntu-latest
    needs: [synth-infra, apple, web]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.synth-infra.result != 'failure' && needs.synth-infra.result != 'cancelled' &&
      needs.apple.result != 'failure' && needs.apple.result != 'cancelled' &&
      needs.web.result != 'failure' && needs.web.result != 'cancelled'
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.SANDBOX_ROLE }}
          aws-region: eu-west-2
      - id: v
        uses: nakomis/nakomis-infra/.github/actions/compute-version@main
        with:
          project: lapcat
      - uses: actions/upload-artifact@v7
        with:
          name: version
          path: version.json

  # ── Deploy to sandbox (auto on merge to main) ─────────────────────────────────
  deploy-sandbox:
    name: Deploy — sandbox
    runs-on: ubuntu-latest
    needs: [changes, version]
    if: always() && needs.version.result == 'success'
    environment: sandbox
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/download-artifact@v8
        with:
          name: version
          path: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'pnpm'
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.SANDBOX_ROLE }}
          aws-region: eu-west-2
      - name: Deploy to sandbox
        if: needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm run ci-deploy-sandbox
      - name: Publish version for app builds
        run: >-
          aws ssm put-parameter --name /lapcat/sandbox/version --type String --overwrite
          --value "$(jq -r .version ../version.json)"
      - uses: nakomis/nakomis-infra/.github/actions/record-deployment@main
        with:
          project: lapcat
          environment: sandbox

  # ── Deploy web portal — sandbox ─────────────────────────────────────────────
  # always() because the `web` job is legitimately skipped on an infra-only
  # change; the explicit result checks still stop it after an infra deploy
  # failure or cancellation. Runs when web OR infra changed: a fresh infra
  # deploy (e.g. a recreated bucket) needs the site uploaded again.
  deploy-web-sandbox:
    name: Deploy web — sandbox
    runs-on: ubuntu-latest
    needs: [changes, web, deploy-sandbox]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.deploy-sandbox.result == 'success' &&
      needs.web.result != 'failure' && needs.web.result != 'cancelled' &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch')
    environment: sandbox
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      # The same version artifact the infra deploy recorded — never recomputed.
      - uses: actions/download-artifact@v8
        with:
          name: version
          path: web/src
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.SANDBOX_ROLE }}
          aws-region: eu-west-2
      - name: Set config
        run: bash scripts/set-config.sh sandbox
      - name: Build
        run: |
          echo "Building web version $(jq -r .version src/version.json)"
          pnpm build
      - name: Upload to S3
        run: |
          BUCKET=$(aws ssm get-parameter --name /lapcat/sandbox/web/bucket --query Parameter.Value --output text)
          aws s3 sync dist/ "s3://${BUCKET}" --delete
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws ssm get-parameter --name /lapcat/sandbox/web/distribution-id --query Parameter.Value --output text)
          aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths "/*"

  # ── Deploy to prod (manual approval required) ────────────────────────────────
  deploy-prod:
    name: Deploy — production
    runs-on: ubuntu-latest
    needs: [changes, deploy-sandbox, deploy-web-sandbox]
    # Don't promote to prod if the sandbox web deploy failed (it is skipped, not
    # failed, when neither web nor infra changed).
    if: |
      always() && github.event_name == 'push' &&
      needs.deploy-sandbox.result == 'success' &&
      needs.deploy-web-sandbox.result != 'failure' && needs.deploy-web-sandbox.result != 'cancelled'
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/download-artifact@v8
        with:
          name: version
          path: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'pnpm'
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.PROD_ROLE }}
          aws-region: eu-west-2
      - name: Deploy to production
        if: needs.changes.outputs.infra == 'true'
        run: pnpm run ci-deploy-prod
      - name: Publish version for app builds
        run: >-
          aws ssm put-parameter --name /lapcat/prod/version --type String --overwrite
          --value "$(jq -r .version ../version.json)"
      - uses: nakomis/nakomis-infra/.github/actions/record-deployment@main
        with:
          project: lapcat
          environment: prod

  # ── Deploy web portal — production ─────────────────────────────────────────────
  # always() because the `web` job is legitimately skipped on an infra-only
  # change; the explicit result checks still stop it after an infra deploy
  # failure or cancellation. Runs when web OR infra changed: a fresh infra
  # deploy (e.g. a recreated bucket) needs the site uploaded again.
  deploy-web-prod:
    name: Deploy web — production
    runs-on: ubuntu-latest
    needs: [changes, web, deploy-prod]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.deploy-prod.result == 'success' &&
      needs.web.result != 'failure' && needs.web.result != 'cancelled' &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true')
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      # The same version artifact the infra deploy recorded — never recomputed.
      - uses: actions/download-artifact@v8
        with:
          name: version
          path: web/src
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.PROD_ROLE }}
          aws-region: eu-west-2
      - name: Set config
        run: bash scripts/set-config.sh prod
      - name: Build
        run: |
          echo "Building web version $(jq -r .version src/version.json)"
          pnpm build
      - name: Upload to S3
        run: |
          BUCKET=$(aws ssm get-parameter --name /lapcat/prod/web/bucket --query Parameter.Value --output text)
          aws s3 sync dist/ "s3://${BUCKET}" --delete
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws ssm get-parameter --name /lapcat/prod/web/distribution-id --query Parameter.Value --output text)
          aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths "/*"

  # ── CI Status gate (always runs, allows skipped jobs) ─────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, infra, synth-infra, apple, web]
    if: always()
    steps:
      - name: Check CI results
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.infra.result }}" \
                   "${{ needs.synth-infra.result }}" "${{ needs.apple.result }}" \
                   "${{ needs.web.result }}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "❌ CI checks failed"
              exit 1
            fi
          done
          echo "✅ All CI checks passed or were skipped"
